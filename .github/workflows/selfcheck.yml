name: selfcheck

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: 自检（含两个崩溃点）
        run: somnians selfcheck
      - name: 离线读数
        run: somnians demo
      - name: 倒排 ≡ 全量（合成 400 条）
        run: |
          python scripts/make_bench.py --n 400 > /tmp/bench.jsonl
          somnians scan --in /tmp/bench.jsonl --out /tmp/a.jsonl --exact
          somnians scan --in /tmp/bench.jsonl --out /tmp/b.jsonl
          python - <<'PY'
          import json
          a = {(json.loads(l)["keeper"], json.loads(l)["drop"]) for l in open("/tmp/a.jsonl")}
          b = {(json.loads(l)["keeper"], json.loads(l)["drop"]) for l in open("/tmp/b.jsonl")}
          assert a == b, f"漏配：{len(a - b)} 多配：{len(b - a)}"
          print(f"一致：{len(a)} 对")
          PY
