name: selfcheck

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Selfcheck
        run: somnians selfcheck
      - name: Offline demo
        run: somnians demo
      - name: Indexed vs exact (synthetic 400 records)
        run: python scripts/check_bench.py

  quality-gate:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix job to pass
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "One or more OS/Python matrix jobs failed or were cancelled."
            exit 1
          fi
