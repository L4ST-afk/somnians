[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "somnians"
version = "0.1.0"
description = "In-place deduplication for agent memory: scan, adjudicate, soft-delete in one transaction, roll back by batch"
readme = "README.md"
authors = [{ name = "L4ST-afk" }]
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["memory", "deduplication", "agent-memory", "audit", "rollback", "cli", "sqlite"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/L4ST-afk/somnians"

[project.scripts]
somnians = "somnians.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
somnians = ["data/*.jsonl", "data/recorded/*.txt"]
